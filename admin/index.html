<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网站管理后台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #1a1a1a;
    }
    .loader { text-align: center; }
    .loader .spinner {
      width: 36px; height: 36px;
      border: 3px solid #ddd;
      border-top-color: #333;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader h2 { font-size: 20px; letter-spacing: 2px; margin-bottom: 6px; font-weight: 300; }
    .loader p { font-size: 14px; color: #888; }
    .loader .hint {
      margin-top: 20px;
      font-size: 13px;
      color: #aaa;
      max-width: 320px;
      line-height: 1.6;
    }
    .loader .hint a { color: #666; }

    /* ==========================================
       Decap CMS 界面自定义
       ========================================== */

    /* Tab 栏全面压制 */
    [role="tablist"],
    [role="tab"] {
      display: none !important;
    }
    [class*="tabBar"],
    [class*="TabBar"],
    [class*="tabbar"],
    [class*="tabs"],
    [class*="Tabs"] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <h2>管理后台</h2>
    <p>正在加载...</p>
    <div class="hint" id="loadHint" style="display:none;">
      <p>加载时间较长？请确认：</p>
      <p>1. 在 Netlify → Site settings → Identity 中开启了 Git Gateway</p>
      <p>2. 已在 Netlify Identity 中邀请自己并设置了密码</p>
      <p><a href="https://app.netlify.com/" target="_blank">前往 Netlify →</a></p>
    </div>
  </div>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>

  <script>
    // =============================================
    // CMS 加载超时提示
    // =============================================
    setTimeout(function() {
      var loader = document.getElementById('loader');
      if (loader && loader.style.display !== 'none') {
        document.getElementById('loadHint').style.display = 'block';
      }
    }, 15000);

    // =============================================
    // 彻底移除 Content/Media Tab 栏
    // 策略：在 DOM 中搜索文本匹配 + 结构特征
    // =============================================
    (function() {
      var TAB_TEXTS = ['Content', 'Media', '内容', '媒体'];

      // 子串匹配：检查 text 是否包含任一 Tab 关键词
      function matchesTab(text) {
        for (var i = 0; i < TAB_TEXTS.length; i++) {
          if (text.indexOf(TAB_TEXTS[i]) !== -1) return true;
        }
        return false;
      }

      // 隐藏单个元素及其空容器
      function hideElement(el) {
        el.style.setProperty('display', 'none', 'important');
        // 如果父容器空了，也隐藏它
        var p = el.parentElement;
        if (p) {
          var allHidden = true;
          for (var i = 0; i < p.children.length; i++) {
            if (p.children[i].style.display !== 'none' &&
                window.getComputedStyle(p.children[i]).display !== 'none') {
              allHidden = false;
              break;
            }
          }
          if (allHidden) {
            p.style.setProperty('display', 'none', 'important');
            // 再检查上一级
            var gp = p.parentElement;
            if (gp && gp.children.length <= 2) {
              gp.style.setProperty('display', 'none', 'important');
            }
          }
        }
      }

      // 从根元素往下递归搜索含有 Tab 文本的节点
      function findTabNodes(root) {
        var found = [];
        if (!root || !root.children) return found;

        for (var i = 0; i < root.children.length; i++) {
          var child = root.children[i];
          var text = child.textContent.trim();
          if (matchesTab(text) && text.length < 30) {
            found.push(child);
            continue;
          }
          var deeper = findTabNodes(child);
          found = found.concat(deeper);
        }
        return found;
      }

      // 策略1: 按角色查找并隐藏容器
      function hideByRole() {
        var found = false;
        var tabs = document.querySelectorAll('[role="tab"], [role="tablist"]');
        for (var i = 0; i < tabs.length; i++) {
          if (tabs[i].textContent.trim().length < 30) {
            hideElement(tabs[i]);
            found = true;
          }
        }
        // 也查找 aria-label
        var byLabel = document.querySelectorAll('[aria-label*="Content"],[aria-label*="Media"],[aria-label*="内容"],[aria-label*="媒体"]');
        for (var i = 0; i < byLabel.length; i++) {
          hideElement(byLabel[i]);
          found = true;
        }
        return found;
      }

      // 策略2: 按文本搜索 + 隐藏容器
      function hideByText() {
        var all = document.querySelectorAll('*');
        var tabNodes = [];
        for (var i = 0; i < all.length; i++) {
          var t = all[i].textContent.trim();
          if (matchesTab(t) && t.length < 30) {
            tabNodes.push(all[i]);
          }
        }

        if (tabNodes.length === 0) return false;

        // 先隐藏所有找到的 tab 节点
        for (var i = 0; i < tabNodes.length; i++) {
          hideElement(tabNodes[i]);
        }

        // 再检查是否共享父容器
        var parent = tabNodes[0].parentElement;
        var sameParent = true;
        for (var i = 1; i < tabNodes.length; i++) {
          if (tabNodes[i].parentElement !== parent) { sameParent = false; break; }
        }
        if (sameParent && parent) {
          parent.style.setProperty('display', 'none', 'important');
        }
        return true;
      }

      // 执行所有策略
      function hideAllTabs() {
        var r1 = hideByRole();
        var r2 = hideByText();
        return r1 || r2;
      }

      // --- 监控 DOM 变化 ---
      var observer = new MutationObserver(function() {
        hideAllTabs();
      });
      observer.observe(document.body, { childList: true, subtree: true, attributes: false });

      // --- 持续轮询 ---
      var maxTry = 80;
      var tried = 0;
      function poll() {
        tried++;
        if (!hideAllTabs() && tried < maxTry) {
          setTimeout(poll, 500);
        } else if (tried < maxTry) {
          setTimeout(poll, 3000);
        }
      }
      setTimeout(poll, 300);
      setTimeout(poll, 1000);
      setTimeout(poll, 3000);
      setTimeout(poll, 6000);

      // 90 秒后停止观察
      setTimeout(function() { observer.disconnect(); }, 90000);
    })();

    // =============================================
    // Netlify Identity 登录处理
    // =============================================
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', function(user) {
        if (!user) {
          window.netlifyIdentity.on('login', function() {
            document.location.href = '/admin/';
          });
        }
      });
    }
  </script>
</body>
</html>
