<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网站管理后台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #1a1a1a;
    }
    .loader { text-align: center; }
    .loader .spinner {
      width: 36px; height: 36px;
      border: 3px solid #ddd;
      border-top-color: #333;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader h2 { font-size: 20px; letter-spacing: 2px; margin-bottom: 6px; font-weight: 300; }
    .loader p { font-size: 14px; color: #888; }
    .loader .hint {
      margin-top: 20px;
      font-size: 13px;
      color: #aaa;
      max-width: 320px;
      line-height: 1.6;
    }
    .loader .hint a { color: #666; }

    /* ==========================================
       Decap CMS 界面自定义
       ========================================== */

    /* Tab 栏全面压制：尝试所有可能的选择器 */
    [role="tablist"],
    [role="tab"] {
      display: none !important;
    }
    [class*="tabBar"],
    [class*="TabBar"],
    [class*="tabbar"],
    [class*="tabs"],
    [class*="Tabs"] {
      display: none !important;
    }
    [class*="editor"] [class*="toggle"],
    [class*="Editor"] [class*="Toggle"] {
      display: none !important;
    }
    /* 把所有 toolbar 里可能包含 tab 的都隐藏 */
    [class*="toolbar"] [class*="tab"],
    [class*="Toolbar"] [class*="Tab"] {
      display: none !important;
    }
    /* 命中有 "内容" 或 "媒体" 字样的按钮容器 */
    :is(button, a, [role="tab"])[class*="content"],
    :is(button, a, [role="tab"])[class*="media"],
    :is(button, a, [role="tab"])[class*="Content"],
    :is(button, a, [role="tab"])[class*="Media"] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <h2>管理后台</h2>
    <p>正在加载...</p>
    <div class="hint" id="loadHint" style="display:none;">
      <p>加载时间较长？请确认：</p>
      <p>1. 在 Netlify → Site settings → Identity 中开启了 Git Gateway</p>
      <p>2. 已在 Netlify Identity 中邀请自己并设置了密码</p>
      <p><a href="https://app.netlify.com/" target="_blank">前往 Netlify →</a></p>
    </div>
  </div>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>

  <script>
    // =============================================
    // CMS 加载超时提示
    // =============================================
    setTimeout(function() {
      var loader = document.getElementById('loader');
      if (loader && loader.style.display !== 'none') {
        document.getElementById('loadHint').style.display = 'block';
      }
    }, 15000);

    // =============================================
    // 彻底移除 Content/Media Tab 栏
    // 策略：在 DOM 中搜索文本匹配 + 结构特征
    // =============================================
    (function() {
      var TAB_TEXTS = ['Content', 'Media', '内容', '媒体'];

      // 从根元素往下递归搜索含有 Tab 文本的节点
      function findTabNodes(root) {
        var found = [];
        if (!root || !root.children) return found;

        for (var i = 0; i < root.children.length; i++) {
          var child = root.children[i];
          // 只查看叶子文本节点或直接包含文本的元素
          var text = child.textContent.trim();
          if (TAB_TEXTS.indexOf(text) !== -1) {
            found.push(child);
            continue; // 已经找到了，不需要往下搜索
          }
          // 递归
          var deeper = findTabNodes(child);
          found = found.concat(deeper);
        }
        return found;
      }

      // 尝试隐藏 Tab 栏
      function hideTabs() {
        // 策略1: 按角色查找
        var byRole = document.querySelectorAll('[role="tab"], [role="tablist"]');
        for (var i = 0; i < byRole.length; i++) {
          if (byRole[i].textContent.trim().length < 20) {
            byRole[i].style.setProperty('display', 'none', 'important');
          }
        }

        // 策略2: 按文本搜索所有元素
        var all = document.querySelectorAll('button, a, span, div, [role="tab"]');
        var tabNodes = [];
        for (var i = 0; i < all.length; i++) {
          var t = all[i].textContent.trim();
          if (TAB_TEXTS.indexOf(t) !== -1) {
            tabNodes.push(all[i]);
          }
        }

        // 如果找到了 tab 按钮，隐藏它们的共同父容器
        if (tabNodes.length >= 2) {
          var parent = tabNodes[0].parentElement;
          // 验证所有 tab 节点是否在同一父容器下
          var sameParent = true;
          for (var i = 1; i < tabNodes.length; i++) {
            if (tabNodes[i].parentElement !== parent) {
              sameParent = false;
              break;
            }
          }
          if (sameParent && parent) {
            parent.style.setProperty('display', 'none', 'important');
            // 也隐藏父容器的父容器（有些 CMS 容器有一层 wrapper）
            if (parent.parentElement &&
                parent.parentElement.children.length <= 3 &&
                parent.parentElement.children.length >= 1) {
              parent.parentElement.style.setProperty('display', 'none', 'important');
            }
            return true;
          } else {
            // 不在同一父容器，各自隐藏
            for (var i = 0; i < tabNodes.length; i++) {
              tabNodes[i].style.setProperty('display', 'none', 'important');
            }
            return true;
          }
        } else if (tabNodes.length === 1) {
          // 只找到一个，隐藏它和它的父容器
          tabNodes[0].style.setProperty('display', 'none', 'important');
          var p = tabNodes[0].parentElement;
          if (p && p.children.length <= 3) {
            p.style.setProperty('display', 'none', 'important');
          }
          return true;
        }
        return false;
      }

      // 策略3: 深搜整个 body，找到所有 tab 节点并隐藏
      function deepSearchAndHide() {
        var tabEls = findTabNodes(document.body);
        if (tabEls.length >= 2) {
          var parent = tabEls[0].parentElement;
          var sameParent = true;
          for (var i = 1; i < tabEls.length; i++) {
            if (tabEls[i].parentElement !== parent) {
              sameParent = false;
              break;
            }
          }
          if (sameParent && parent) {
            parent.style.setProperty('display', 'none', 'important');
          } else {
            for (var i = 0; i < tabEls.length; i++) tabEls[i].style.setProperty('display', 'none', 'important');
          }
          return true;
        } else if (tabEls.length === 1) {
          tabEls[0].style.setProperty('display', 'none', 'important');
          return true;
        }
        return false;
      }

      // --- 监控 DOM 变化 ---
      var observer = new MutationObserver(function() {
        hideTabs();
        deepSearchAndHide();
      });
      observer.observe(document.body, { childList: true, subtree: true, attributes: false });

      // --- 持续轮询 ---
      var maxTry = 60;
      var tried = 0;
      function poll() {
        tried++;
        var h1 = hideTabs();
        var h2 = deepSearchAndHide();
        if ((!h1 && !h2) && tried < maxTry) {
          setTimeout(poll, 1000);
        } else if (h1 || h2) {
          // 成功后每 5 秒再检查一次（CMS 会重新渲染）
          setTimeout(poll, 5000);
        }
      }
      setTimeout(poll, 500);
      setTimeout(poll, 2000);
      setTimeout(poll, 5000);

      // 60 秒后停止观察
      setTimeout(function() { observer.disconnect(); }, 60000);
    })();

    // =============================================
    // Netlify Identity 登录处理
    // =============================================
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', function(user) {
        if (!user) {
          window.netlifyIdentity.on('login', function() {
            document.location.href = '/admin/';
          });
        }
      });
    }
  </script>
</body>
</html>
