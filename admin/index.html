<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网站管理后台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #faf7f2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #2d2d2d;
    }
    .loader { text-align: center; }
    .loader .spinner {
      width: 36px; height: 36px;
      border: 3px solid #e8e0d8;
      border-top-color: #9a8a7a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader h2 { font-size: 20px; letter-spacing: 2px; margin-bottom: 6px; }
    .loader p { font-size: 14px; color: #999080; }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <h2>管理后台</h2>
    <p>正在加载...</p>
  </div>

  <!-- Netlify Identity（用于登录认证） -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Decap CMS（网站内容管理系统） -->
  <script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>

  <!-- 处理登录后的重定向 -->
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', function(user) {
        if (!user) {
          window.netlifyIdentity.on('login', function() {
            document.location.href = '/admin/';
          });
        }
      });
    }
  </script>
</body>
</html>
