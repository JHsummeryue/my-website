<body class="page-enter">

<nav>
  <div class="nav-inner">
    <div class="nav-logo">我的小站</div>

<main>

  <!-- ==========================================

  <!-- ==========================================
       三个功能入口

<script src="js/app.js"></script>
<script>
// =============================================
// 首页动态：照片轮播 + 每日名言
// =============================================

// --- 图片路径处理（与 gallery.html 保持一致） ---
function imgPath(file) {
  if (!file) return '';
  if (file.startsWith('photos/') || file.startsWith('/photos/') || file.startsWith('http')) return file;
  return 'photos/' + file;
}

// --- 照片轮播 ---
(function () {
  var inner = document.getElementById('slideshowInner');
  var nav = document.getElementById('slideshowNav');
  var slides = [];
  var current = 0;
  var timer = null;

  function startSlideshow(photos) {
    // 打乱顺序，最多选 8 张
    var shuffled = photos.slice().sort(function () { return Math.random() - 0.5; });
    var selected = shuffled.slice(0, Math.min(8, shuffled.length));
    if (selected.length === 0) return;

    selected.forEach(function (photo, i) {
      var div = document.createElement('div');
      div.className = 'slide' + (i === 0 ? ' active' : '');
      div.innerHTML = '<img src="' + imgPath(photo.file) + '" alt="' + photo.title + '" onerror="this.parentElement.remove()">';
      inner.appendChild(div);
      slides.push(div);

      var dot = document.createElement('span');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.addEventListener('click', function () { goTo(parseInt(this.dataset.index)); });
      dot.dataset.index = i;
      nav.appendChild(dot);
    });

    if (slides.length > 1) timer = setInterval(nextSlide, 5000);
  }

  function goTo(index) {
    if (index === current || index < 0 || index >= slides.length) return;
    slides[current].classList.remove('active');
    nav.children[current].classList.remove('active');
    current = index;
    slides[current].classList.add('active');
    nav.children[current].classList.add('active');
    clearInterval(timer);
    timer = setInterval(nextSlide, 5000);
  }

  function nextSlide() {
    goTo((current + 1) % slides.length);
  }

  fetch('data/photos.json')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var entries = data.entries || [];
      if (entries.length > 0) startSlideshow(entries);
    })
    .catch(function () {});
})();

// --- 每日名言 ---
(function () {
  var quoteText = document.getElementById('quoteText');
  var quoteSource = document.getElementById('quoteSource');
  var quoteBox = document.getElementById('dailyQuote');

  fetch('data/books.json')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var entries = data.entries || [];
      if (entries.length === 0) return;

      // 用当天日期做哈希，每天看到同一句
      var dateStr = new Date().toDateString();
      var hash = 0;
      for (var i = 0; i < dateStr.length; i++) {
        hash = ((hash << 5) - hash) + dateStr.charCodeAt(i);
        hash |= 0;
      }
      var book = entries[Math.abs(hash) % entries.length];
      var firstLine = book.notes.split('\n')[0];

      quoteText.textContent = '「' + firstLine + '」';
      quoteSource.textContent = '—— 《' + book.title + '》' + (book.author ? ' · ' + book.author : '');
      quoteBox.style.display = 'block';
    })
    .catch(function () {});
})();
</script>

</body>
</html>
